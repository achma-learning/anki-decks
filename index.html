<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anki Decks Store</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: #1a1a2e;
      border-bottom: 1px solid #2a2a4a;
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #6c63ff, #3ecf8e);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .logo-text {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
    }

    .logo-text span { color: #6c63ff; }

    .header-sub {
      color: #888;
      font-size: 14px;
      margin-left: auto;
    }

    /* ── Nav links ── */
    nav {
      display: flex;
      gap: 4px;
      margin-left: 24px;
    }

    nav a {
      color: #aaa;
      text-decoration: none;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 6px;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }

    nav a:hover { background: #2a2a4a; color: #fff; }

    @media (max-width: 700px) { nav { display: none; } }

    /* ── Main ── */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    /* ── Hero ── */
    .hero {
      text-align: center;
      padding: 48px 24px 56px;
    }

    .hero h1 {
      font-size: clamp(28px, 5vw, 48px);
      font-weight: 800;
      color: #fff;
      line-height: 1.2;
    }

    .hero h1 span {
      background: linear-gradient(135deg, #6c63ff, #3ecf8e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      margin-top: 16px;
      font-size: 18px;
      color: #aaa;
      max-width: 520px;
      margin-inline: auto;
    }

    .hero-actions {
      margin-top: 28px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* ── Section ── */
    section { margin-bottom: 60px; }

    .section-title {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #2a2a3a;
    }

    .section-subtitle {
      font-size: 14px;
      color: #666;
      font-weight: 400;
      margin-left: 6px;
    }

    /* ── Subsection label ── */
    .subsection-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #555;
      margin-bottom: 12px;
      margin-top: 28px;
    }

    /* ── Cards grid ── */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .cards-compact {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }

    /* ── Card ── */
    .card {
      background: #1c1c2e;
      border: 1px solid #2a2a4a;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(108, 99, 255, 0.2);
    }

    .card-banner {
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
    }

    .card-banner.sm { height: 70px; font-size: 32px; }

    .card-body {
      padding: 16px 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
    }

    .card-title.sm { font-size: 13px; }

    .card-desc {
      font-size: 13px;
      color: #999;
      line-height: 1.55;
      flex: 1;
    }

    .card-desc.sm { font-size: 12px; }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 4px;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      background: #2a2a4a;
      color: #9090d0;
    }

    .badge.green  { background: #1a3a2a; color: #3ecf8e; }
    .badge.purple { background: #2a1a4a; color: #a990ff; }
    .badge.blue   { background: #1a2a4a; color: #60b0ff; }
    .badge.orange { background: #3a2a1a; color: #ffaa60; }
    .badge.red    { background: #3a1a1a; color: #ff8080; }
    .badge.teal   { background: #1a3a3a; color: #40d0d0; }
    .badge.yellow { background: #3a3a1a; color: #d0d040; }

    .card-footer {
      padding: 12px 18px;
      border-top: 1px solid #2a2a3a;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.2s;
      white-space: nowrap;
    }

    .btn:hover { opacity: 0.82; }

    .btn-primary   { background: linear-gradient(135deg, #6c63ff, #5a54d4); color: #fff; }
    .btn-green     { background: linear-gradient(135deg, #3ecf8e, #30a870); color: #fff; }
    .btn-orange    { background: linear-gradient(135deg, #ff8c42, #e67a30); color: #fff; }
    .btn-red       { background: linear-gradient(135deg, #ff5f7e, #d94a68); color: #fff; }
    .btn-teal      { background: linear-gradient(135deg, #20c0c0, #189898); color: #fff; }
    .btn-secondary { background: #2a2a4a; color: #a0a0d0; }
    .btn-backup    { background: #1a1a2a; color: #666; font-size: 11px; padding: 5px 10px; }

    /* ── Resource list ── */
    .resource-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .resource-item {
      background: #1c1c2e;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      transition: background 0.2s;
      color: inherit;
    }

    .resource-item:hover { background: #222242; }

    .resource-icon {
      font-size: 22px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2a2a4a;
      border-radius: 10px;
      flex-shrink: 0;
    }

    .resource-info h3 { font-size: 14px; font-weight: 600; color: #fff; }
    .resource-info p  { font-size: 12px; color: #777; margin-top: 2px; }

    .resource-arrow { margin-left: auto; color: #444; font-size: 18px; }

    /* ── Two-column resource grid ── */
    .resource-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 10px;
    }

    /* ── AnKing highlight banner ── */
    .anking-banner {
      background: linear-gradient(135deg, #1e1a3a, #1a2a3a);
      border: 1px solid #3a3060;
      border-radius: 16px;
      padding: 24px 28px;
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .anking-logo { font-size: 48px; }

    .anking-info h3 { font-size: 20px; font-weight: 700; color: #fff; }
    .anking-info p  { font-size: 14px; color: #888; margin-top: 4px; }

    .anking-actions { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 32px 24px;
      color: #444;
      font-size: 13px;
      border-top: 1px solid #1a1a2a;
    }

    footer a { color: #666; text-decoration: none; }
    footer a:hover { color: #999; }
  </style>
</head>

// ═══════════════════════════════════════════════════════════════════════════════
// RENDERER — don't edit this unless the page layout needs to change
// ═══════════════════════════════════════════════════════════════════════════════

function renderBtn(b) {
  return `<a class="btn ${b.cls}" href="${b.href}" target="_blank" rel="noopener">${b.label}</a>`;
}

function renderBadge(b) {
  return `<span class="badge ${b.color || ''}">${b.label}</span>`;
}

function renderCard(item) {
  const sm = item.compact;
  return `
    <div class="card">
      <div class="card-banner${sm ? ' sm' : ''}" style="background:${item.bg}">${item.banner}</div>
      <div class="card-body">
        <div class="card-title${sm ? ' sm' : ''}">${item.title}${item.titleNote ? `<span style="font-size:11px;font-weight:400;color:#666;">${item.titleNote}</span>` : ''}</div>
        <div class="card-desc${sm ? ' sm' : ''}">${item.desc}</div>
        ${item.badges ? `<div class="card-meta">${item.badges.map(renderBadge).join('')}</div>` : ''}
      </div>
      <div class="card-footer">${item.buttons.map(renderBtn).join('')}</div>
    </div>`;
}

function renderResourceItem(item) {
  if (!item.buttons) {
    return `
    <a class="resource-item" href="${item.href}" target="_blank" rel="noopener">
      <div class="resource-icon">${item.icon}</div>
      <div class="resource-info"><h3>${item.title}</h3><p>${item.desc}</p></div>
      <span class="resource-arrow">›</span>
    </a>`;
  }
  return `
    <div class="resource-item" style="cursor:default;">
      <div class="resource-icon">${item.icon}</div>
      <div class="resource-info"><h3>${item.title}</h3><p>${item.desc}</p></div>
      <div style="margin-left:auto;display:flex;gap:8px;flex-shrink:0;">${item.buttons.map(renderBtn).join('')}</div>
    </div>`;
}

function renderSection(sec) {
  const titleHtml = sec.titleSub
    ? `${sec.title} <span class="section-subtitle">${sec.titleSub}</span>`
    : sec.title;

  let contentHtml = '';

  if (sec.layout === 'resource-grid') {
    contentHtml = `<div class="resource-grid">${sec.items.map(renderResourceItem).join('')}</div>`;

  } else if (sec.subsections) {
    contentHtml = sec.subsections.map(sub => `
      <div class="subsection-label">${sub.label}</div>
      <div class="cards">${sub.items.map(renderCard).join('')}</div>`).join('');

  } else {
    const gridCls = sec.layout === 'cards-compact' ? 'cards-compact' : 'cards';
    let topBannerHtml = '';
    if (sec.topBanner) {
      const b = sec.topBanner;
      topBannerHtml = `
      <div class="anking-banner">
        <div class="anking-logo">${b.logo}</div>
        <div class="anking-info"><h3>${b.title}</h3><p>${b.desc}</p></div>
        <div class="anking-actions">${b.actions.map(renderBtn).join('')}</div>
      </div>`;
    }
    contentHtml = topBannerHtml + `<div class="${gridCls}">${sec.items.map(renderCard).join('')}</div>`;
  }

  return `
  <section id="${sec.id}">
    <h2 class="section-title">${titleHtml}</h2>
    ${contentHtml}
  </section>`;
}

function init() {
  document.getElementById('store-root').innerHTML = STORE.map(renderSection).join('');
  document.getElementById('nav-links').innerHTML = STORE.map(s =>
    `<a href="#${s.id}">${s.navLabel}</a>`
  ).join('');
}

init();
</script>
</body>
</html>
